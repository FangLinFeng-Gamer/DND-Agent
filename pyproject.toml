[project]
name = "dnd-agent"
version = "0.1.0"
description = "Offline-first DND-Agent MVP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.5.2",
    "fastapi>=0.135.3",
    "httpx>=0.28.1",
    "langchain>=1.2.15",
    "langgraph>=1.1.6",
    "pytest>=9.0.1",
    "uvicorn>=0.44.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["test"]
